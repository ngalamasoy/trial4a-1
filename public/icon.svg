<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E27A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7818" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131A26" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.35" stroke-width="6" />

  <!-- Subtle Grid Accents -->
  <line x1="96" y1="168" x2="416" y2="168" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" />
  <line x1="96" y1="344" x2="416" y2="344" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" />

  <!-- Candlestick 1 (Bearish Gold Outline) -->
  <line x1="148" y1="196" x2="148" y2="364" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" />
  <rect x="122" y="232" width="52" height="88" rx="10" fill="#0B0E14" stroke="url(#goldGrad)" stroke-width="10" />

  <!-- Candlestick 2 (Bullish Gold Solid) -->
  <line x1="256" y1="142" x2="256" y2="338" stroke="#F6E27A" stroke-width="12" stroke-linecap="round" />
  <rect x="230" y="182" width="52" height="114" rx="10" fill="url(#goldGrad)" />

  <!-- Candlestick 3 (Breakout Bullish Emerald + Gold Crown) -->
  <line x1="364" y1="106" x2="364" y2="294" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
  <rect x="338" y="136" width="52" height="118" rx="10" fill="#10B981" />

  <!-- Ascending Trendline -->
  <path d="M118 352 L256 266 L390 156" fill="none" stroke="#F6E27A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" />
  <circle cx="390" cy="156" r="12" fill="#F6E27A" />
</svg>
